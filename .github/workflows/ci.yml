name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q src/toolahead
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: toolahead --help
      - run: toolahead-mcp --help

  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python .github/scripts/normalize_sdist.py dist/*.tar.gz
      - name: Verify clean distribution contents
        run: python .github/scripts/check_distribution.py dist/*.whl dist/*.tar.gz
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: toolahead --help
      - run: toolahead-mcp --help
