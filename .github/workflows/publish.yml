name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/toolahead/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python .github/scripts/normalize_sdist.py dist/*.tar.gz
      - name: Verify clean distribution contents
        run: python .github/scripts/check_distribution.py dist/*.whl dist/*.tar.gz
      - uses: pypa/gh-action-pypi-publish@release/v1
