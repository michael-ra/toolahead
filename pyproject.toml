[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolahead"
version = "0.5.0"
description = "Speculative execution for Codex, Claude Code, and MCP coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ToolAhead contributors" }]
keywords = ["coding-agent", "codex", "claude-code", "prefetch", "latency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
watch = ["watchdog>=4"]
dev = ["build>=1.2", "twine>=5"]

[project.scripts]
toolahead = "toolahead.cli:main"
toolahead-mcp = "toolahead.mcp:main"

[project.urls]
Homepage = "https://github.com/michael-ra/toolahead"
Repository = "https://github.com/michael-ra/toolahead"
Issues = "https://github.com/michael-ra/toolahead/issues"
Changelog = "https://github.com/michael-ra/toolahead/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
